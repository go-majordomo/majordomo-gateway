apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: majordomo

resources:
  - namespace.yaml
  - secret.yaml
  - postgres.yaml
  - gateway.yaml

# Point this at wherever you push the image built from the repo Dockerfile
# (e.g. ghcr.io/go-majordomo/majordomo-gateway). Override the tag per release.
images:
  - name: majordomo-gateway
    newName: majordomo-gateway
    newTag: latest
