# Replace the placeholder values before applying:
#   vi k8s/secret.yaml
# ADMIN_TOKEN can be generated with: openssl rand -hex 32
apiVersion: v1
kind: Secret
metadata:
  name: majordomo-secrets
type: Opaque
stringData:
  POSTGRES_USER: majordomo
  POSTGRES_PASSWORD: CHANGE_ME
  POSTGRES_DB: majordomo_gateway
  ADMIN_TOKEN: CHANGE_ME
