# Replace the placeholder values before applying:
#   vi k8s/secret.yaml
# ADMIN_TOKEN (and ENCRYPTION_KEY) can be generated with: openssl rand -hex 32
apiVersion: v1
kind: Secret
metadata:
  name: majordomo-secrets
type: Opaque
stringData:
  POSTGRES_USER: majordomo
  POSTGRES_PASSWORD: CHANGE_ME
  POSTGRES_DB: majordomo_gateway
  ADMIN_TOKEN: CHANGE_ME
  # Provider routing (optional; off by default). To enable, set a real 32-byte key
  # here AND uncomment the ENCRYPTION_KEY / ROUTING_* env entries in gateway.yaml.
  # A placeholder value would fail startup — leave commented unless routing is on.
  # ENCRYPTION_KEY: CHANGE_ME
