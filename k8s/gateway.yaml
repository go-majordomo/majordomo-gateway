# Gateway Deployment (2 replicas) + ClusterIP Service on port 6560.
# Migrations run automatically on container startup before serving.
apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels:
    app: gateway
spec:
  type: ClusterIP
  selector:
    app: gateway
  ports:
    - name: http
      port: 6560
      targetPort: 6560
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: majordomo-gateway
          ports:
            - name: http
              containerPort: 6560
          env:
            - name: PORT
              value: "6560"
            - name: POSTGRES_HOST
              value: postgres
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_SSLMODE
              value: disable
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: majordomo-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: majordomo-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: majordomo-secrets
                  key: POSTGRES_DB
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: majordomo-secrets
                  key: ADMIN_TOKEN
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
